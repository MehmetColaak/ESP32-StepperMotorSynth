; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Main firmware: 5-voice MIDI stepper synth
[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<test_motors.cpp> -<test_onboard_led.cpp>

; Bring-up test: runs the 5 motors one after another
;   pio run -e test-motor -t upload -t monitor
[env:test-motor]
build_src_filter = +<test_motors.cpp>
monitor_filters = send_on_enter
monitor_echo = yes

; Bring-up test: blink the onboard RGB LED (GPIO 48, or 38 on v1.1 boards)
;   pio run -e test-led -t upload -t monitor
[env:test-led]
build_src_filter = +<test_onboard_led.cpp>
monitor_filters = send_on_enter
monitor_echo = yes
